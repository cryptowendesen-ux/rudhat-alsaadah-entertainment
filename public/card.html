<style>
:root{--ink:#18324a;--muted:#64748b;--bg:#fffaf5;--pink:#ff5f87;--orange:#ff9a5f;--yellow:#ffd95a;--line:#f0e6dd;--green:#16a34a;--shadow:0 22px 65px rgba(24,50,74,.12)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,Arial,sans-serif;line-height:1.5;min-height:100%;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
html[dir=rtl] body{font-family:Cairo,Nunito,Arial,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{width:min(460px,92%);margin:0 auto;padding:16px 0 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font:800 15px "Baloo 2",Arial,sans-serif;letter-spacing:.2px}
.brand i{font-style:normal;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--yellow),var(--pink));font-size:20px}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;color:var(--ink)}

.card{position:relative;overflow:hidden;border-radius:30px;padding:24px 22px 22px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--orange));box-shadow:var(--shadow)}
.card:before,.card:after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.12;pointer-events:none}
.card:before{width:220px;height:220px;right:-70px;top:-80px}
.card:after{width:150px;height:150px;left:-50px;bottom:-60px}
.card.off{background:linear-gradient(135deg,#94a3b8,#64748b)}
.card > *{position:relative;z-index:1}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.holder{font:800 26px/1.15 "Baloo 2",Arial,sans-serif;margin:0;word-break:break-word}
html[dir=rtl] .holder{font-family:Cairo,Arial,sans-serif}
.pkg{display:inline-block;margin-top:6px;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 12px;font-weight:800;font-size:13px}
.badge{flex:none;background:#fff;color:var(--green);border-radius:999px;padding:5px 12px;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.badge.bad{color:#b91c1c}
.ring{position:relative;width:208px;height:208px;margin:18px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.28)}
.ring .bar{stroke:#fff;transition:stroke-dashoffset .9s ease}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font:800 38px/1.05 "Baloo 2",Arial,sans-serif}
html[dir=rtl] .ringtxt b{font-family:Cairo,Arial,sans-serif;font-size:34px}
.ringtxt span{font-weight:800;font-size:13px;opacity:.92}
.meta{text-align:center;font-weight:800;font-size:14px;opacity:.95}
.meta div+div{margin-top:2px;font-weight:700;opacity:.9}
.low{margin-top:12px;background:rgba(255,255,255,.2);border-radius:14px;padding:9px 12px;text-align:center;font-weight:800;font-size:14px}

.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px;margin-top:16px;box-shadow:0 8px 28px rgba(24,50,74,.05)}
.panel h2{margin:0 0 12px;font:800 18px "Baloo 2",Arial,sans-serif}
html[dir=rtl] .panel h2{font-family:Cairo,Arial,sans-serif}
.qrbox{text-align:center}
.qr{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px}
.qr svg{display:block;width:190px;height:190px}
.qrbox p{margin:10px 0 0;color:var(--muted);font-weight:700;font-size:14px}
.code{display:inline-block;margin-top:8px;font:800 22px "Baloo 2",monospace;letter-spacing:3px;direction:ltr}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fffaf5;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}
.hist .when{color:var(--muted);font-size:12px;font-weight:700}
.hist .amt{font-weight:900;white-space:nowrap;direction:ltr}
.amt.plus{color:var(--green)} .amt.minus{color:var(--pink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:15px;margin-top:12px}
.btn.wa{background:#25D366;color:#fff}
.btn.soft{background:#fff;border:1px solid var(--line);color:var(--ink)}
.tip{margin:14px 4px 0;text-align:center;color:var(--muted);font-weight:700;font-size:13px}
.msg{text-align:center;padding:30px 10px;color:var(--muted);font-weight:800}
.msg.err{color:#b91c1c}
.entry{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px 20px;box-shadow:var(--shadow);text-align:center}
.entry h1{margin:0 0 6px;font:800 26px "Baloo 2",Arial,sans-serif}
html[dir=rtl] .entry h1{font-family:Cairo,Arial,sans-serif}
.entry p{margin:0 0 14px;color:var(--muted);font-weight:700}
.entry input{width:100%;border:1px solid #dce2ea;border-radius:14px;padding:14px;font:800 22px "Baloo 2",monospace;letter-spacing:4px;text-align:center;text-transform:uppercase;color:var(--ink);outline:none;direction:ltr}
.entry input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,95,135,.15)}
.entry .btn{background:var(--pink);color:#fff}
.sk{height:300px;border-radius:30px;background:linear-gradient(90deg,#f6ede4,#fff4ea,#f6ede4);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.ring .bar{transition:none}.sk{animation:none}}
[hidden]{display:none!important}
</style>

  var normCode = function (v) { return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  var pretty = function (c) { return c ? c.slice(0, 4) + '-' + c.slice(4) : ''; };

  function fmt(mins) {
    mins = Math.max(0, Math.round(mins));
    var h = Math.floor(mins / 60), m = mins % 60, u = S[lang];
    if (!h && !m) return '0' + u.m;
    return (h ? h + u.h : '') + (h && m ? ' ' : '') + (m ? m + u.m : '');
  }
  function fmtDate(v) {
    var d = new Date(v);
    if (isNaN(d)) return '';
    try {
      return d.toLocaleDateString(lang === 'ar' ? 'ar-AE' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Dubai' });
    } catch (e) { return d.toISOString().slice(0, 10); }
  }
  function fmtDay(iso) {
    var d = new Date(iso + 'T12:00:00Z');
    try {
      return d.toLocaleDateString(lang === 'ar' ? 'ar-AE' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    } catch (e) { return iso; }
  }

  function qrSvg(text) {
    var rows = RudhatQR(text), n = rows.length, q = 2, d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (rows[r][c]) d += 'M' + (c + q) + ' ' + (r + q) + 'h1v1h-1z';
    var s = n + q * 2;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges" role="img" aria-label="QR">' +
      '<rect width="' + s + '" height="' + s + '" fill="#fff"/><path d="' + d + '" fill="#18324a"/></svg>';
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    langBtn.textContent = lang === 'ar' ? 'English' : 'العربية';
    document.title = t('title') + ' | RUDHAT ALSAADAH';
    document.getElementById('backLink').textContent = t('back');
  }

  function renderEntry(msgKey) {
    app.innerHTML = '<div class="entry"><h1>' + esc(t('check')) + '</h1><p>' + esc(t('enter')) + '</p>' +
      (msgKey ? '<p class="msg err" style="padding:0 0 12px">' + esc(t(msgKey)) + '</p>' : '') +
      '<input id="codeIn" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" inputmode="text">' +
      '<button class="btn" id="goBtn" type="button">' + esc(t('go')) + '</button></div>';
    var inp = document.getElementById('codeIn');
    var go = function () {
      var c = normCode(inp.value);
      if (c.length >= 6) location.href = '/card/' + encodeURIComponent(c);
    };
    document.getElementById('goBtn').onclick = go;
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    inp.focus();
  }

  function render() {
    applyLang();
    if (!code) return renderEntry(errKey);
    if (errKey) {
      app.innerHTML = '<div class="msg err">' + esc(t(errKey)) + '</div>' +
        '<button class="btn soft" id="retry" type="button">' + esc(t('refresh')) + '</button>' +
        '<a class="btn soft" href="/card">' + esc(t('check')) + '</a>';
      document.getElementById('retry').onclick = load;
      return;
    }
    if (!data) return;
    var c = data, total = Math.max(1, c.totalMinutes), ratio = Math.max(0, Math.min(1, c.remainingMinutes / total));
    var off = c.state !== 'active';
    var R = 84, C = 2 * Math.PI * R;
    var low = c.state === 'active' && c.remainingMinutes <= 120;
    var link = location.origin + '/card/' + c.code;
    var hist = (c.ledger || []).map(function (l) {
      var plus = l.minutes > 0;
      var note = S[lang].notes[l.note] || l.note;
      return '<li><div><div>' + esc(note) + '</div><div class="when">' + esc(fmtDate(l.at)) + '</div></div>' +
        '<span class="amt ' + (plus ? 'plus' : 'minus') + '">' + (plus ? '+' : '−') + esc(fmt(Math.abs(l.minutes))) + '</span></li>';
    }).join('');
    app.innerHTML =
      '<div class="card' + (off ? ' off' : '') + '">' +
        '<div class="chead"><div><h1 class="holder">' + esc(c.holder) + '</h1>' +
        (c.packageTitle ? '<span class="pkg">' + esc(c.packageTitle) + '</span>' : '') + '</div>' +
        '<span class="badge' + (off ? ' bad' : '') + '">' + esc(t(c.state)) + '</span></div>' +
        '<div class="ring"><svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="' + R + '" fill="none" stroke-width="16"/>' +
        '<circle class="bar" id="ringBar" cx="100" cy="100" r="' + R + '" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '"/></svg>' +
        '<div class="ringtxt"><b>' + esc(fmt(c.remainingMinutes)) + '</b><span>' + esc(t('left')) + ' · ' + esc(t('of')) + ' ' + esc(fmt(c.totalMinutes)) + '</span></div></div>' +
        '<div class="meta"><div>' + (c.expiresAt ? esc(t('until')) + ' ' + esc(fmtDay(c.expiresAt)) : esc(t('noexp'))) + '</div></div>' +
        (low ? '<div class="low">' + esc(t('low')) + '</div>' : '') +
      '</div>' +
      '<div class="panel qrbox"><div class="qr">' + qrSvg(link) + '</div><p>' + esc(t('qr')) + '</p>' +
        '<div class="code">' + esc(pretty(c.code)) + '</div></div>' +
      '<div class="panel"><h2>' + esc(t('hist')) + '</h2>' +
        (hist ? '<ul class="hist">' + hist + '</ul>' : '<div class="msg" style="padding:6px">' + esc(t('empty')) + '</div>') + '</div>' +
      '<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/' + esc(WA) + '?text=' + encodeURIComponent(t('waText') + pretty(c.code) + ')') + '">💬 ' + esc(t('wa')) + '</a>' +
      '<button class="btn soft" id="refresh" type="button">↻ ' + esc(t('refresh')) + '</button>' +
      '<p class="tip">' + esc(t('tip')) + '</p>';
    document.getElementById('refresh').onclick = load;
    var bar = document.getElementById('ringBar');
    requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.strokeDashoffset = (C * (1 - ratio)).toFixed(2); }); });
  }

  var m = location.pathname.match(/\/card\/([^\/?#]+)/i);
  var code = normCode(m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get('c'));

  function load() {
    if (!code) { render(); return; }
    errKey = '';
    fetch('/api/cards/' + encodeURIComponent(code), { cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (res) {
        if (res.s === 200) { data = res.j; errKey = ''; }
        else { data = null; errKey = res.s === 404 ? 'nf' : 'err'; }
        render();
      })
      .catch(function () { data = null; errKey = 'err'; render(); });
  }

  langBtn.onclick = function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('lang', lang); } catch (e) {}
    render();
  };

  fetch('/api/content').then(function (r) { return r.json(); }).then(function (j) {
    var w = j && j.settings && String(j.settings.whatsapp || '').replace(/\D/g, '');
    if (w) { WA = w; if (data) render(); }
  }).catch(function () {});

  applyLang();
  load();
  timer = setInterval(function () { if (!document.hidden && code && data) load(); }, 60000);
})();
</script>
</body>
</html>
