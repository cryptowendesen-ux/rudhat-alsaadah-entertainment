<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff5f87">
<title>Page not found | RUDHAT ALSAADAH</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%88%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#18324a;--muted:#64748b;--bg:#fffaf5;--pink:#ff5f87;--line:#f0e6dd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Nunito,Cairo,Arial,sans-serif;padding:20px}
.box{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:36px 24px;text-align:center;box-shadow:0 22px 65px rgba(24,50,74,.1)}
.big{font-size:64px;line-height:1}
h1{margin:12px 0 6px;font-size:28px}
p{margin:0 0 20px;color:var(--muted);font-weight:600}
a.btn{display:inline-block;background:var(--pink);color:#fff;text-decoration:none;font-weight:800;padding:13px 22px;border-radius:999px}
button{margin-top:16px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>
<div class="box">
  <div class="big">🎈</div>
  <h1 id="h">Page not found</h1>
  <p id="p">Sorry, we couldn't find the page you are looking for.</p>
  <a class="btn" id="a" href="/">Back to website</a><br>
  <button id="b" type="button">العربية</button>
</div>
<script>
(function(){
  var ar=false;try{ar=localStorage.getItem('lang')==='ar';}catch(e){}
  var T={en:['Page not found',"Sorry, we couldn't find the page you are looking for.",'Back to website','العربية','/'],
         ar:['الصفحة غير موجودة','عذراً، لم نعثر على الصفحة التي تبحث عنها.','العودة للموقع','English','/ar']};
  function set(){var t=T[ar?'ar':'en'];
    document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';
    h.textContent=t[0];p.textContent=t[1];a.textContent=t[2];b.textContent=t[3];a.href=t[4];
    document.title=t[0]+' | RUDHAT ALSAADAH';}
  var h=document.getElementById('h'),p=document.getElementById('p'),a=document.getElementById('a'),b=document.getElementById('b');
  b.onclick=function(){ar=!ar;try{localStorage.setItem('lang',ar?'ar':'en');}catch(e){}set();};
  set();
})();
</script>
</body>
</html>
