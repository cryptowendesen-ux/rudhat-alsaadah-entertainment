<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff5f87">
<title>Page not found | RUDHAT ALSAADAH</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%88%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#18324a;--muted:#5b6b7e;--bg:#fffaf5;--pink:#ff5f87;--line:#f0e6dd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Nunito,Arial,sans-serif;padding:24px}
html[dir=rtl] body{font-family:Cairo,Tahoma,Arial,sans-serif}
.box{width:min(460px,100%);text-align:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px 24px;box-shadow:0 22px 65px rgba(24,50,74,.1)}
.emoji{font-size:64px;line-height:1}
h1{margin:12px 0 6px;font-size:28px}
p{margin:0 0 20px;color:var(--muted);font-weight:700;line-height:1.6}
a.btn{display:inline-block;background:var(--pink);color:#fff;text-decoration:none;font-weight:900;border-radius:999px;padding:13px 26px}
button.lang{display:block;margin:16px auto 0;border:0;background:none;color:var(--muted);font:inherit;font-weight:800;cursor:pointer;text-decoration:underline}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="box">
  <div class="emoji">🎈</div>
  <div id="en">
    <h1>Oops! Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a class="btn" href="/">Back to the website</a>
  </div>
  <div id="ar" hidden>
    <h1>عذراً! الصفحة غير موجودة</h1>
    <p>الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>
    <a class="btn" href="/ar">العودة إلى الموقع</a>
  </div>
  <button class="lang" id="langBtn" type="button">العربية</button>
</div>
<script>
(function () {
  var ar = false;
  try { ar = localStorage.getItem('lang') === 'ar'; } catch (e) {}
  var btn = document.getElementById('langBtn');
  function apply() {
    document.documentElement.lang = ar ? 'ar' : 'en';
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    document.getElementById('en').hidden = ar;
    document.getElementById('ar').hidden = !ar;
    btn.textContent = ar ? 'English' : 'العربية';
    document.title = ar ? 'الصفحة غير موجودة | روضة السعادة' : 'Page not found | RUDHAT ALSAADAH';
  }
  btn.onclick = function () { ar = !ar; apply(); };
  apply();
})();
</script>
</body>
</html>
