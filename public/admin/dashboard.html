<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUDHAT ADMIN DASHBOARD</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}
.top{background:#0f172a;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800}
.logout{border:0;background:#fff;color:#0f172a;border-radius:9px;padding:9px 14px;font-weight:700}
.wrap{max-width:1200px;margin:auto;padding:25px 18px}
h1{margin:0 0 6px}
.sub{color:#64748b;margin-bottom:25px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 15px rgba(15,23,42,.06)}
.card span{font-size:12px;color:#64748b;font-weight:700}
.card strong{display:block;font-size:30px;margin-top:8px}
.panel{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 4px 15px rgba(15,23,42,.06)}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.panel h2{font-size:19px;margin:0}
button{cursor:pointer}
.add{border:0;background:#2563eb;color:white;border-radius:9px;padding:10px 15px;font-weight:700}
.row{border-top:1px solid #e2e8f0;padding:14px 0;display:flex;align-items:center;gap:12px}
.row:first-child{border-top:0}
.info{flex:1}
.title{font-weight:700}
.desc{font-size:13px;color:#64748b;margin-top:4px}
.price{font-weight:700;min-width:100px}
.edit,.delete{border:0;border-radius:8px;padding:8px 11px;font-weight:700}
.edit{background:#e0f2fe;color:#075985}
.delete{background:#fee2e2;color:#991b1b}
.empty{color:#64748b;padding:12px 0}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.box{background:white;width:100%;max-width:500px;border-radius:18px;padding:25px}
.box h2{margin-top:0}
label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;padding:12px;border:0;border-radius:9px;font-weight:700}
.cancel{background:#e2e8f0}
.save{background:#2563eb;color:white}
#error{color:#b91c1c;margin-top:12px}
@media(max-width:800px){
.cards{grid-template-columns:repeat(2,1fr)}
.row{flex-wrap:wrap}
.price{min-width:auto}
}
@media(max-width:500px){
.cards{grid-template-columns:1fr 1fr}
.top{padding:13px}
.wrap{padding:18px 12px}
}
</style>
</head>

<body>

<header class="top">
  <div class="logo">🎈 RUDHAT ADMIN</div>
  <button class="logout" id="logout">Logout</button>
</header>

<main class="wrap">

  <h1>Business Dashboard</h1>
  <div class="sub">Manage your RUDHAT ALSAADAH website content.</div>

  <section class="cards">
    <div class="card">
      <span>SERVICES</span>
      <strong id="serviceCount">0</strong>
    </div>
    <div class="
card">
      <span>PRICE PLANS</span>
      <strong id="priceCount">0</strong>
    </div>

    <div class="card">
      <span>GALLERY</span>
      <strong id="galleryCount">0</strong>
    </div>

    <div class="card">
      <span>BIRTHDAY</span>
      <strong id="birthdayCount">0</strong>
    </div>
  </section>

  <div id="content"></div>

</main>

<div class="modal" id="modal">
  <div class="box">

    <h2 id="modalTitle">Add Item</h2>

    <label>TYPE</label>
    <select id="type">
      <option value="services">Service</option>
      <option value="prices">Price</option>
      <option value="gallery">Gallery</option>
      <option value="birthday">Birthday</option>
    </select>

    <label>TITLE</label>
    <input id="title" placeholder="Title">

    <label>DESCRIPTION</label>
    <textarea id="description" placeholder="Description"></textarea>

    <label>PRICE</label>
    <input id="price" placeholder="e.g. AED 50">

    <div id="error"></div>

    <div class="actions">
      <button class="cancel" id="cancel">Cancel</button>
      <button class="save" id="save">Save</button>
    </div>

  </div>
</div>

<script>

const token=sessionStorage.getItem('adminToken');

if(!token){
  window.location.href='/admin/';
}

let data={
  services:[],
  prices:[],
  gallery:[],
  birthday:[]
};

let editing=null;

const content=document.getElementById('content');
const modal=document.getElementById('modal');

async function api(url,options={}){

  options.headers={
    ...(options.headers||{}),
    Authorization:'Bearer '+token,
    'Content-Type':'application/json'
  };

  const res=await fetch(url,options);

  if(res.status===401){
    sessionStorage.removeItem('adminToken');
    window.location.href='/admin/';
    return;
  }

  const result=await res.json();

  if(!res.ok){
    throw new Error(result.error||'Request failed');
  }

  return result;
}

function escapeHtml(value){

  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}

function render(){

  document.getElementById('serviceCount').textContent=data.services.length;
  document.getElementById('priceCount').textContent=data.prices.length;
  document.getElementById('galleryCount').textContent=data.gallery.length;
  document.getElementById('birthdayCount').textContent=data.birthday.length;

  const sections=[
    ['services','🎨 Services'],
    ['prices','💰 Prices'],
    ['gallery','🖼️ Gallery'],
    ['birthday','🎂 Birthday']
  ];

  content.innerHTML=sections.map(([type,name])=>`

    <section class="panel">

      <div class="panelhead">
        <h2>${name}</h2>

        <button
          class="add"
          onclick="openAdd('${type}')">
          ＋ Add
        </button>
      </div>

      ${
        data[type].length
        ?
        data[type].map(item=>`

          <div class="row">

            <div class="info">

              <div class="title">
                ${escapeHtml(item.title)}
              </div>

              <div class="desc">
                ${escapeHtml(item.description||'')}
              </div>

            </div>

            <div class="price">
              ${escapeHtml(item.price||'')}
            </div>

            <button
              class="edit"
              onclick="openEdit('${type}','${item.id}')">
              Edit
            </button>

            <button
              class="delete"
              onclick="removeItem('${type}','${item.id}')">
              Delete
            </button>

          </div>

        `).join('')
        :
        '<div class="empty">No items yet.</div>'
      }

    </section>

  `).join('');
}

async function load(){

  try{

    data=await api('/api/admin/content');
    render();

  }catch(e){

    alert(e.message);

  }

}

function openAdd(type){

  editing=null;

  document.getElementById('modalTitle').textContent='Add Item';

  document.getElementById('type').value=type;
  document.getElementById('type').disabled=false;

  document.getElementById('title').value='';
  document.getElementById('description').value='';
  document.getElementById('price').value='';
  document.getElementById('error').textContent='';

  modal.classList.add('open');

}

function openEdit(type,id){

  const item=data[type].find(x=>x.id===id);

  if(!item)return;

  editing={type,id};

  document.getElementById('modalTitle').textContent='Edit Item';

  document.getElementById('type').value=type;
  document.getElementById('type').disabled=true;

  document.getElementById('title').value=item.title||'';
  document.getElementById('description').value=item.description||'';
  document.getElementById('price').value=item.price||'';
  document.getElementById('error').textContent='';

  modal.classList.add('open');

}

document.getElementById('cancel').onclick=()=>{

  modal.classList.remove('open');

};

document.getElementById('save').onclick=async()=>{

  const type=document.getElementById('type').value;

  const body={

    title:document.getElementById('title').value.trim(),
    description:document.getElementById('description').value,
    price:document.getElementById('price').value,
    published:true

  };

  if(!body.title){

    document.getElementById('error').textContent=
      'Title is required.';

    return;

  }

  try{

    if(editing){

      await api(
        `/api/admin/items/${editing.type}/${editing.id}`,
        {
          method:'PUT',
          body:JSON.stringify(body)
        }
      );

    }else{

      await api(
        '/api/admin/items',
        {
          method:'POST',
          body:JSON.stringify({
            ...body,
            type
          })
        }
      );

    }

    modal.classList.remove('open');

    await load();

  }catch(e){

    document.getElementById('error').textContent=e.message;

  }

};

async function removeItem(type,id){

  if(!confirm('Delete this item?'))return;

  try{

    await api(
      `/api/admin/items/${type}/${id}`,
      {
        method:'DELETE'
      }
    );

    await load();

  }catch(e){

    alert(e.message);

  }

}

document.getElementById('logout').onclick=()=>{

  sessionStorage.removeItem('adminToken');
  window.location.href='/admin/';

};

load();

</script>

</body>
</html>
