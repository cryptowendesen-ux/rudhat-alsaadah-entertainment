<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUDHAT ADMIN DASHBOARD</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}
.top{background:#0f172a;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800}
.logout{border:0;background:#fff;color:#0f172a;border-radius:9px;padding:9px 14px;font-weight:700}
.wrap{max-width:1200px;margin:auto;padding:25px 18px}
h1{margin:0 0 6px}
.sub{color:#64748b;margin-bottom:25px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 15px rgba(15,23,42,.06)}
.card span{font-size:12px;color:#64748b;font-weight:700}
.card strong{display:block;font-size:30px;margin-top:8px}
.panel{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 4px 15px rgba(15,23,42,.06)}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.panel h2{font-size:19px;margin:0}
button{cursor:pointer}
.add{border:0;background:#2563eb;color:white;border-radius:9px;padding:10px 15px;font-weight:700}
.row{border-top:1px solid #e2e8f0;padding:14px 0;display:flex;align-items:center;gap:12px}
.row:first-child{border-top:0}
.info{flex:1}
.title{font-weight:700}
.desc{font-size:13px;color:#64748b;margin-top:4px}
.price{font-weight:700;min-width:100px}
.edit,.delete{border:0;border-radius:8px;padding:8px 11px;font-weight:700}
.edit{background:#e0f2fe;color:#075985}
.delete{background:#fee2e2;color:#991b1b}
.empty{color:#64748b;padding:12px 0}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.box{background:white;width:100%;max-width:500px;border-radius:18px;padding:25px}
.box h2{margin-top:0}
label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;padding:12px;border:0;border-radius:9px;font-weight:700}
.cancel{background:#e2e8f0}
.save{background:#2563eb;color:white}
#error{color:#b91c1c;margin-top:12px}
@media(max-width:800px){
.cards{grid-template-columns:repeat(2,1fr)}
.row{flex-wrap:wrap}
.price{min-width:auto}
}
@media(max-width:500px){
.cards{grid-template-columns:1fr 1fr}
.top{padding:13px}
.wrap{padding:18px 12px}
}
</style>
</head>

<body>

<header class="top">
  <div class="logo">🎈 RUDHAT ADMIN</div>
  <button class="logout" id="logout">Logout</button>
</header>

<main class="wrap">

  <h1>Business Dashboard</h1>
  <div class="sub">Manage your RUDHAT ALSAADAH website content.</div>

  <section class="cards">
    <div class="card">
      <span>SERVICES</span>
      <strong id="serviceCount">0</strong>
